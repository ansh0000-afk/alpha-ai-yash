name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3

      - name: Force Create Minimum Node Project
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Build Directory
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            find . -maxdepth 2 -name "index.html" -exec cp {} dist/ \; || true
          fi
          if [ ! -f dist/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>Alpha AI</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Setup Capacitor and Generate Android
        run: |
          echo '{"appId": "com.alphaai.app", "appName": "Alpha AI", "webDir": "dist"}' > capacitor.config.json
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
