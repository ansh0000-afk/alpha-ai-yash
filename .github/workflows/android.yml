name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure Package JSON Exists
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "alpha-ai", "version": "1.0.0", "scripts": {"build": "vite build"}}' > package.json
          fi

      - name: Create Web Dist Directory
        run: |
          mkdir -p dist
          if [ -z "$(ls -A dist)" ]; then
            echo '<!DOCTYPE html><html><head><title>Alpha AI</title></head><body><h1>Alpha AI App</h1></body></html>' > dist/index.html
          fi

      - name: Try Vite Build if available
        run: |
          npm install vite || true
          npx vite build || true

      - name: Setup Capacitor and Build Android
        run: |
          echo '{"appId": "com.alphaai.app", "appName": "Alpha AI", "webDir": "dist"}' > capacitor.config.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
